[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophtha-agent"
version = "0.1.0"
description = "A stateful evidence-aware Agent wrapper for ophthalmology RAG"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
runtime = ["langgraph>=0.2", "openai>=1.0"]
test = ["pytest>=8.0"]

[project.scripts]
ophtha-agent = "ophtha_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

