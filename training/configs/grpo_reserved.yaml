# GRPO is deliberately reserved, not executable in v0.
enabled: false
method: grpo
policy_model: ${POLICY_MODEL_PATH}
environment: ophtha-agent-runtime
task_registry: data/grpo_task_registry.jsonl
verifier: ophtha_agent.verifier.EvidenceVerifier
rollout_backend: not_configured
group_size: 4
terminal_reward: verifier_only
preconditions:
  - real_model_endpoint_checked
  - environment_reset_checked
  - reward_contract_checked
  - heldout_split_frozen

