# Reservation template. Training is not started by the Agent CLI.
enabled: false
method: qlora_sft
base_model: ${POLICY_MODEL_PATH}
model_revision: ${POLICY_MODEL_REVISION}
dataset: data/sft_train.jsonl
eval_dataset: data/sft_eval.jsonl
load_in_4bit: true
adapter: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
cutoff_len: 2048
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.00002
num_train_epochs: 2
temperature: 0
output_dir: runs/sft_qlora
overwrite_output_dir: false

